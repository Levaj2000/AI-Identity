[project]
name = "ai-identity"
version = "0.2.0"
description = "AI Identity public trust surface: offline verifier, SDKs, OCSF and CoSAI mappings"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"cli/**" = ["UP017"]  # CLI targets Python 3.9+; datetime.UTC requires 3.11+

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# The platform test suites (api, gateway, common, mandate) live in the private
# platform repository. This repository tests the public verifier CLI.
testpaths = ["cli"]
pythonpath = ["cli"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
