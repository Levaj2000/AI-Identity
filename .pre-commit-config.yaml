# Pre-commit hooks — https://pre-commit.com
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files

repos:
  # ── Housekeeping ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── Python: ruff lint + format ────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Public-repo hygiene: no confidential GTM material ─────────────────
  - repo: local
    hooks:
      - id: no-confidential-material
        name: no confidential material (public repo)
        entry: scripts/check-no-confidential.sh
        language: system
        pass_filenames: false
        always_run: true

  # ── Brand consistency: Four Pillars canon ─────────────────────────────
  - repo: local
    hooks:
      - id: brand-pillar-consistency
        name: brand consistency (Four Pillars canon)
        entry: scripts/check-pillar-consistency.sh
        language: system
        pass_filenames: false
        files: ^(landing-page|docs|marketing)/.*\.(ts|tsx|js|jsx|html|md|mdx)$
