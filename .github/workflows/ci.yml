name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-confidential:
    name: Public repo — no confidential material
    runs-on: ubuntu-latest

    # Same script as the pre-commit hook, so the patterns never drift. The hook
    # lives in one clone and dies with `--no-verify`; this job is the backstop.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need the merge base, not just the tip

      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-no-confidential.sh --range "$BASE_SHA" "$HEAD_SHA"

      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        # A direct push to main bypasses the PR gate. Admins are not covered by
        # branch protection here, so scan those commits too. `before` is all
        # zeros on a branch's first push and can point at a force-pushed-away
        # commit; fall back to the parent when it is not resolvable.
        run: |
          base="$BEFORE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || echo "$AFTER_SHA")
          fi
          scripts/check-no-confidential.sh --range "$base" "$AFTER_SHA"

  python-lint-test:
    name: Python — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # The verifier CLI is stdlib-only for chain verification. Its tests
        # also exercise attestation and checkpoint signatures (cryptography)
        # and the aid client (httpx).
        run: |
          pip install -r requirements-dev.txt
          pip install pytest httpx cryptography

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest -v
