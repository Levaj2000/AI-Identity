name: Rust

# `integrations/cpex-ocsf-audit` had no CI at all: every other job in this
# repo is Python, Node or CodeQL, so a change to the crate's manifest could
# go green without anything ever compiling it. Renovate PR #497 is the
# case in point — it bumped base64/p256/sha2 in Cargo.toml, failed to
# regenerate Cargo.lock (its checkout has no cpex sibling for the path
# dependency), and still showed nine green checks.
#
# `--locked` is the guard that closes that hole: it fails outright when
# Cargo.toml asks for versions Cargo.lock does not carry, rather than
# silently resolving them.
#
# Path-filtered on purpose. The crate changes rarely and the job costs a
# cpex clone plus a cold Rust build; the other CI jobs should not pay that
# on every docs PR.

# No `paths:` filter here, on purpose. The job below is a required status
# check, and a workflow skipped by a path filter never reports, so every PR
# that does not touch the crate would wait on it forever. The job always runs
# and reports under the same name; its first step decides whether the build
# and tests are needed (see "Detect crate changes").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The crate's MSRV and `rust-version` pin (see Cargo.toml), and the
  # toolchain demo/run-demo.sh builds with.
  TOOLCHAIN: 1.96.1

  # cpex-core is a path dependency on a sibling checkout, not a registry
  # crate — the crate is deliberately not a member of the cpex workspace so
  # it can live here as a reference implementation (see Cargo.toml).
  #
  # Pinned to the current tip of contextforge-org/cpex `feat/audit-seam`,
  # `64c8eba` — the 2026-09-02 pair of commits that made the audit stream
  # identity host-settable (`plugin_settings.audit_stream_namespace`, the
  # programmatic `audit_epoch`, both bridged field-by-field into
  # `ExecutorConfig`) and dropped `Clone` from `EffectEmitterSlot`.
  # `examples/panic_drive.rs` drives the manager path with a host
  # namespace, so it does not compile against anything older; the pin
  # cannot sit behind it. The seam is still branch-only: neither `main`
  # nor `dev` contains it.
  #
  # Pinned rather than tracking the branch so a bump in this crate is the
  # only variable in a red run — the same reason Cargo.toml tells you to pin
  # a rev for anything reproducible. Bump this deliberately, and only with
  # the crate re-verified against the newer seam: build, tests, and
  # `cargo run --example emit_sample` byte-identical (SAMPLE-OUTPUT.md is an
  # AID-EMIT-1 §12 conformance vector, so a changed byte is a real finding).
  CPEX_REV: 64c8eba85fac28fa7e73b6c83d32aca7356ca23d

  # The second host. praxis-proxy/policy PR #84 is Teryl's port of the
  # same seam into the Praxis Policy Engine; the crate builds against it
  # under `--no-default-features --features ppe`. That dependency is a
  # git dep pinned by full SHA in Cargo.toml (the PR #84 head the crate
  # was last re-verified on; PRAXIS-PORT-RESULTS.md records each bump),
  # so there is nothing to clone here: Cargo fetches it, and --locked
  # holds it to the lock.
  # Both hosts build in this one job because the cpex path dependency
  # has to resolve even when the `cpex` feature is off.

jobs:
  cpex-ocsf-audit:
    name: Rust — cpex-ocsf-audit build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: integrations/cpex-ocsf-audit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Two commits are enough to see the change. On a pull_request run
          # HEAD is GitHub's merge commit, whose first parent is the base tip,
          # so HEAD^1..HEAD is exactly the PR; on a push to main it is the
          # merge or squash commit that landed.
          fetch-depth: 2

      - name: Detect crate changes
        id: changes
        working-directory: ${{ github.workspace }}
        # Builds unless the diff proves nothing relevant changed: a diff that
        # cannot be computed (no parent commit) builds, it never skips.
        run: |
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "Could not diff HEAD^1..HEAD; building to be safe."
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE '^(integrations/cpex-ocsf-audit/|\.github/workflows/rust\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under integrations/cpex-ocsf-audit/ and no change to rust.yml:"
            echo "build and tests skipped, and the required check reports success."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out cpex beside the repo
        if: steps.changes.outputs.rust == 'true'
        working-directory: ${{ github.workspace }}
        # `path = "../../../cpex/crates/cpex-core"` resolves to a sibling of
        # the repo root, which actions/checkout cannot write to (it refuses
        # paths outside the workspace), so fetch it directly. A depth-1 fetch
        # of the pinned SHA is ~6 MB against a full clone's several hundred.
        run: |
          mkdir -p ../cpex
          cd ../cpex
          git init -q .
          git remote add origin https://github.com/contextforge-org/cpex
          git fetch -q --depth 1 origin "$CPEX_REV"
          git checkout -q FETCH_HEAD
          test -f crates/cpex-core/Cargo.toml

      - name: Install Rust ${{ env.TOOLCHAIN }}
        if: steps.changes.outputs.rust == 'true'
        # rustup ships on the runner image, so pinning the MSRV needs no
        # third-party action — one less SHA to keep fresh.
        working-directory: ${{ github.workspace }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup run "$TOOLCHAIN" rustc --version

      - name: Build (cpex host) — lib, tests and examples
        if: steps.changes.outputs.rust == 'true'
        # --locked is the point of this job: a manifest bump that did not
        # regenerate Cargo.lock fails here instead of going green.
        # -D warnings holds the "clean, no warnings" bar SEAM-PORT-RESULTS.md
        # claims for the port.
        env:
          RUSTFLAGS: -D warnings
        run: cargo "+$TOOLCHAIN" check --locked --all-targets

      - name: Test (cpex host)
        if: steps.changes.outputs.rust == 'true'
        run: cargo "+$TOOLCHAIN" test --locked

      - name: Build (ppe host) — lib, tests and examples
        if: steps.changes.outputs.rust == 'true'
        # Same bar against the praxis seam. PRAXIS-PORT-RESULTS.md claims
        # "clean, no warnings" for this host too.
        env:
          RUSTFLAGS: -D warnings
        run: cargo "+$TOOLCHAIN" check --locked --all-targets --no-default-features --features ppe

      - name: Test (ppe host)
        if: steps.changes.outputs.rust == 'true'
        run: cargo "+$TOOLCHAIN" test --locked --no-default-features --features ppe
