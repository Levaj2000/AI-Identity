name: Publish langchain-ai-identity to PyPI

on:
  push:
    tags:
      - "langchain-v*"   # trigger on tags like langchain-v0.1.0, langchain-v0.2.0

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write   # required for trusted publishing (no API key needed)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatchling build twine

      - name: Build package
        working-directory: sdk/langchain
        run: python -m build

      - name: Check distribution
        working-directory: sdk/langchain
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/langchain/dist/
