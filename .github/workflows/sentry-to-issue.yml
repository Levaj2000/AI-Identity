name: Sentry error to issue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    # Opt in only after the maintainer has selected a Sentry project whose
    # errors are appropriate to track in this public repository.
    if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sentry-to-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Create issues for recent unresolved errors
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python scripts/sentry_to_issue.py
